<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Rezai Vision – Icon "Film-Mail" (Klappe + Umschlag + @) Bronze -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7DFBB"/>
      <stop offset="0.28" stop-color="#E4B87F"/>
      <stop offset="0.6" stop-color="#BE8850"/>
      <stop offset="0.82" stop-color="#95602F"/>
      <stop offset="1" stop-color="#6B4321"/>
    </linearGradient>
    <linearGradient id="bronzeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B98A54"/>
      <stop offset="1" stop-color="#6A431F"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#sh)">
    <!-- ===== Filmklappe (oben, leicht geneigt) ===== -->
    <g transform="rotate(-7 100 60)">
      <!-- Klapp-Arm -->
      <g transform="rotate(-15 34 44)">
        <rect x="30" y="36" width="140" height="15" rx="3.5" fill="url(#bronze)"/>
        <g fill="#2c1d0f" fill-opacity="0.8">
          <polygon points="40,36 52,36 44,51 32,51"/>
          <polygon points="64,36 76,36 68,51 56,51"/>
          <polygon points="88,36 100,36 92,51 80,51"/>
          <polygon points="112,36 124,36 116,51 104,51"/>
          <polygon points="136,36 148,36 140,51 128,51"/>
          <polygon points="160,36 170,36 164,51 152,51"/>
        </g>
      </g>
      <!-- Schiefertafel -->
      <rect x="30" y="53" width="140" height="17" rx="3.5" fill="url(#bronze)"/>
      <circle cx="34.5" cy="47" r="3.2" fill="#3a2712"/>
    </g>

    <!-- ===== Umschlag ===== -->
    <rect x="30" y="80" width="140" height="92" rx="11" fill="url(#bronze)"/>
    <!-- Klappe (V) -->
    <path d="M34,86 L100,132 L166,86" fill="none" stroke="#3a2712" stroke-opacity="0.45"
          stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M34,166 L82,128 M166,166 L118,128" fill="none" stroke="#3a2712" stroke-opacity="0.35"
          stroke-width="3.5" stroke-linecap="round"/>

    <!-- ===== @ Symbol ===== -->
    <g transform="translate(100,128)" fill="none" stroke="url(#bronzeDark)" stroke-linecap="round">
      <circle r="22" stroke="#3a2712" stroke-opacity="0.4" stroke-width="6.5"/>
      <circle r="9" stroke="#3a2712" stroke-opacity="0.55" stroke-width="5"/>
      <path d="M9,-7 v12 q0,7 9,4.5" stroke="#3a2712" stroke-opacity="0.55" stroke-width="5"/>
    </g>

    <!-- Glanzkante Umschlag -->
    <rect x="30" y="80" width="140" height="92" rx="11" fill="none" stroke="#FBEAD0" stroke-opacity="0.5" stroke-width="1.4"/>
  </g>
</svg>
