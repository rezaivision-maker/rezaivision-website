<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 91 61">
  <!-- ============================================================
       REZAI VISION – Visitenkarte VORDERSEITE
       Endformat 85 x 55 mm + 3 mm Beschnitt ringsum = 91 x 61 mm
       Schriftarten: "Montserrat" (Logo/Headline) & "Inter" (Text)
       ============================================================ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15161B"/>
      <stop offset="0.55" stop-color="#0E0F13"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#2A2C36" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2A2C36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund (volle Beschnittfläche) -->
  <rect x="0" y="0" width="91" height="61" fill="url(#bg)"/>
  <rect x="0" y="0" width="91" height="61" fill="url(#glow)"/>

  <!-- feiner Rahmen im Sicherheitsbereich -->
  <rect x="8" y="8" width="75" height="45" fill="none" stroke="#2E3038" stroke-width="0.25"/>

  <!-- Akzentlinie -->
  <rect x="34.5" y="35.4" width="22" height="0.5" rx="0.25" fill="#C9A24B"/>

  <!-- Wortmarke -->
  <text x="45.5" y="28.5" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700"
        font-size="6.2" letter-spacing="0.4" fill="#F5F5F2">REZAI<tspan font-weight="300" fill="#C9A24B"> VISION</tspan></text>

  <!-- Tagline -->
  <text x="45.5" y="42.5" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500"
        font-size="2.3" letter-spacing="0.95" fill="#B9BCC4">VIDEOPRODUKTION &#183; KAISERSLAUTERN</text>

  <!-- Beschnittmarken -->
  <g stroke="#555" stroke-width="0.2">
    <line x1="0" y1="3" x2="2" y2="3"/><line x1="3" y1="0" x2="3" y2="2"/>
    <line x1="91" y1="3" x2="89" y2="3"/><line x1="88" y1="0" x2="88" y2="2"/>
    <line x1="0" y1="58" x2="2" y2="58"/><line x1="3" y1="61" x2="3" y2="59"/>
    <line x1="91" y1="58" x2="89" y2="58"/><line x1="88" y1="61" x2="88" y2="59"/>
  </g>
</svg>
